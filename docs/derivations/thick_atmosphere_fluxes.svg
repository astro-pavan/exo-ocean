<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Energy fluxes in the two-column model</title>
  <desc>Four boxes: dayside and nightside atmosphere above dayside and nightside surface. Stellar flux reaches the dayside surface through a transparent atmosphere. Each surface emits longwave radiation, part absorbed by the atmosphere and part transmitted to space. Each atmosphere emits to space and back to the surface, exchanges sensible heat with the surface, and the atmosphere and ocean carry heat from day to night.</desc>

  <defs>
    <marker id="sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="lw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="sh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="tr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>

  <rect x="0" y="0" width="900" height="450" rx="8" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="13" font-style="italic" fill="#6b7280">space</text>

  <!-- boxes -->
  <rect x="50" y="100" width="350" height="150" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="500" y="100" width="350" height="150" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="50" y="320" width="350" height="90" rx="4" fill="#f5e6d3" stroke="#92400e" stroke-width="1.5"/>
  <rect x="500" y="320" width="350" height="90" rx="4" fill="#f5e6d3" stroke="#92400e" stroke-width="1.5"/>

  <g text-anchor="middle" fill="#111827">
    <text x="275" y="165" font-size="14" font-weight="600">Dayside atmosphere</text>
    <text x="275" y="189" font-size="14">T<tspan dy="4" font-size="10">a,d</tspan></text>
    <text x="275" y="212" font-size="12" fill="#4b5563">dry adiabat, optical depth τ</text>

    <text x="700" y="165" font-size="14" font-weight="600">Nightside atmosphere</text>
    <text x="700" y="189" font-size="14">T<tspan dy="4" font-size="10">a,n</tspan></text>
    <text x="700" y="212" font-size="12" fill="#4b5563">dry adiabat, optical depth τ</text>

    <text x="225" y="360" font-size="14" font-weight="600">Dayside surface / ocean</text>
    <text x="225" y="384" font-size="14">T<tspan dy="4" font-size="10">s,d</tspan></text>

    <text x="675" y="360" font-size="14" font-weight="600">Nightside surface / ocean</text>
    <text x="675" y="384" font-size="14">T<tspan dy="4" font-size="10">s,n</tspan></text>
  </g>

  <!-- dayside column -->
  <g fill="none" stroke-width="2">
    <!-- stellar: transparent atmosphere, dashed where it passes through -->
    <path d="M85,15 V100" stroke="#d97706"/>
    <path d="M85,100 V250" stroke="#d97706" stroke-dasharray="5 4"/>
    <path d="M85,250 V318" stroke="#d97706" marker-end="url(#sw)"/>
    <!-- surface emission transmitted to space -->
    <path d="M145,320 V250" stroke="#dc2626"/>
    <path d="M145,250 V100" stroke="#dc2626" stroke-dasharray="5 4"/>
    <path d="M145,100 V42" stroke="#dc2626" marker-end="url(#lw)"/>
    <!-- absorbed surface emission, back radiation, sensible heat -->
    <path d="M215,320 V252" stroke="#dc2626" marker-end="url(#lw)"/>
    <path d="M285,250 V318" stroke="#dc2626" marker-end="url(#lw)"/>
    <path d="M355,250 V318" stroke="#059669" marker-end="url(#sh)"/>
    <!-- atmospheric emission to space -->
    <path d="M285,100 V42" stroke="#dc2626" marker-end="url(#lw)"/>
  </g>

  <!-- nightside column -->
  <g fill="none" stroke-width="2">
    <path d="M545,320 V250" stroke="#dc2626"/>
    <path d="M545,250 V100" stroke="#dc2626" stroke-dasharray="5 4"/>
    <path d="M545,100 V42" stroke="#dc2626" marker-end="url(#lw)"/>
    <path d="M615,320 V252" stroke="#dc2626" marker-end="url(#lw)"/>
    <path d="M685,250 V318" stroke="#dc2626" marker-end="url(#lw)"/>
    <path d="M755,250 V318" stroke="#059669" marker-end="url(#sh)"/>
    <path d="M685,100 V42" stroke="#dc2626" marker-end="url(#lw)"/>
  </g>

  <!-- day to night transport -->
  <g fill="none" stroke-width="2.5" stroke="#2563eb">
    <path d="M402,175 H497" marker-end="url(#tr)"/>
    <path d="M402,365 H497" marker-end="url(#tr)"/>
  </g>

  <!-- flux labels -->
  <g font-size="14" fill="#111827">
    <text x="92" y="66">F<tspan dy="4" font-size="10">sw</tspan></text>
    <text x="152" y="66">e<tspan dy="-6" font-size="10">−τ</tspan><tspan dy="6">SLR</tspan><tspan dy="4" font-size="10">d</tspan></text>
    <text x="292" y="66">OLR<tspan dy="4" font-size="10">d</tspan><tspan dy="-10" font-size="10">atm</tspan></text>
    <text x="221" y="290">ASLR<tspan dy="4" font-size="10">d</tspan></text>
    <text x="291" y="290">GLR<tspan dy="4" font-size="10">d</tspan></text>
    <text x="361" y="290">F<tspan dy="4" font-size="10">s,d</tspan></text>

    <text x="552" y="66">e<tspan dy="-6" font-size="10">−τ</tspan><tspan dy="6">SLR</tspan><tspan dy="4" font-size="10">n</tspan></text>
    <text x="692" y="66">OLR<tspan dy="4" font-size="10">n</tspan><tspan dy="-10" font-size="10">atm</tspan></text>
    <text x="621" y="290">ASLR<tspan dy="4" font-size="10">n</tspan></text>
    <text x="691" y="290">GLR<tspan dy="4" font-size="10">n</tspan></text>
    <text x="761" y="290">F<tspan dy="4" font-size="10">s,n</tspan></text>

    <text x="449" y="163" text-anchor="middle">F<tspan dy="4" font-size="10">a</tspan></text>
    <text x="449" y="353" text-anchor="middle">F<tspan dy="4" font-size="10">o</tspan></text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#374151">
    <line x1="60" y1="433" x2="84" y2="433" stroke="#d97706" stroke-width="2"/><text x="90" y="437">stellar</text>
    <line x1="160" y1="433" x2="184" y2="433" stroke="#dc2626" stroke-width="2"/><text x="190" y="437">longwave</text>
    <line x1="275" y1="433" x2="299" y2="433" stroke="#059669" stroke-width="2"/><text x="305" y="437">sensible heat</text>
    <line x1="405" y1="433" x2="429" y2="433" stroke="#2563eb" stroke-width="2.5"/><text x="435" y="437">day–night transport</text>
    <line x1="580" y1="433" x2="604" y2="433" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 4"/><text x="610" y="437">passes through unabsorbed</text>
  </g>
</svg>
